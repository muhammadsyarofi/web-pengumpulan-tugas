<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#367CFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="priGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#367CFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#367CFF"/>
    </linearGradient>
    <linearGradient id="scrGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121B2B"/>
      <stop offset="1" stop-color="#080B14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172338"/>
      <stop offset="1" stop-color="#0E1422"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient futuristic rings -->
  <circle cx="280" cy="230" r="200" fill="url(#bgGlow)"/>
  <circle cx="280" cy="230" r="158" fill="none" stroke="#367CFF" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="8 8"/>
  <circle cx="280" cy="230" r="120" fill="none" stroke="#00D9FF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Futuristic Laptop Base & Screen -->
  <rect x="130" y="136" width="300" height="192" rx="18" fill="#1E293B" stroke="#367CFF" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="142" y="148" width="276" height="168" rx="10" fill="url(#scrGrad)"/>

  <!-- Top bar inside screen -->
  <circle cx="158" cy="162" r="4" fill="#EF4444"/>
  <circle cx="170" cy="162" r="4" fill="#F59E0B"/>
  <circle cx="182" cy="162" r="4" fill="#22C55E"/>
  <rect x="200" y="158" width="110" height="8" rx="4" fill="#1E293B"/>

  <!-- Screen Dashboard UI -->
  <rect x="158" y="180" width="136" height="16" rx="8" fill="url(#priGrad)"/>
  <rect x="158" y="204" width="240" height="8" rx="4" fill="#1E293B"/>
  <rect x="158" y="218" width="190" height="8" rx="4" fill="#1E293B"/>

  <!-- 3 Neon Metric Cards inside Laptop -->
  <rect x="158" y="240" width="76" height="58" rx="10" fill="#121B2B" stroke="#367CFF" stroke-opacity="0.45"/>
  <rect x="168" y="252" width="36" height="8" rx="4" fill="#00D9FF"/>
  <rect x="168" y="268" width="52" height="6" rx="3" fill="#8EA0BC" opacity="0.5"/>
  <rect x="168" y="280" width="44" height="6" rx="3" fill="#367CFF" opacity="0.4"/>

  <rect x="242" y="240" width="76" height="58" rx="10" fill="#121B2B" stroke="#8B5CF6" stroke-opacity="0.45"/>
  <rect x="252" y="252" width="36" height="8" rx="4" fill="#8B5CF6"/>
  <rect x="252" y="268" width="52" height="6" rx="3" fill="#8EA0BC" opacity="0.5"/>
  <rect x="252" y="280" width="40" height="6" rx="3" fill="#8B5CF6" opacity="0.4"/>

  <rect x="326" y="240" width="76" height="58" rx="10" fill="#121B2B" stroke="#22C55E" stroke-opacity="0.45"/>
  <rect x="336" y="252" width="36" height="8" rx="4" fill="#22C55E"/>
  <rect x="336" y="268" width="52" height="6" rx="3" fill="#8EA0BC" opacity="0.5"/>
  <rect x="336" y="280" width="48" height="6" rx="3" fill="#22C55E" opacity="0.4"/>

  <!-- Laptop Base Deck -->
  <path d="M104 328h352l-20 24a16 16 0 0 1-12 6H136a16 16 0 0 1-12-6z" fill="#1E293B" stroke="#367CFF" stroke-opacity="0.35"/>
  <rect x="235" y="332" width="90" height="6" rx="3" fill="url(#accGrad)"/>

  <!-- Floating Holographic Card Left: Tugas Terkumpul -->
  <g filter="url(#glow)">
    <rect x="32" y="96" width="132" height="78" rx="16" fill="url(#cardGrad)" stroke="#00D9FF" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="62" cy="128" r="16" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E" stroke-width="2"/>
    <path d="M55 128l5 5 10-11" stroke="#22C55E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="86" y="118" width="60" height="8" rx="4" fill="#E6EDF7"/>
    <rect x="86" y="132" width="42" height="6" rx="3" fill="#00D9FF"/>
    <rect x="48" y="154" width="98" height="6" rx="3" fill="#367CFF" opacity="0.4"/>
  </g>

  <!-- Floating Holographic Card Right: Modul / PDF -->
  <g filter="url(#glow)">
    <rect x="404" y="82" width="128" height="84" rx="16" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="420" y="98" width="34" height="42" rx="7" fill="url(#priGrad)"/>
    <text x="437" y="124" font-family="Poppins,Segoe UI,sans-serif" font-weight="800" font-size="11" fill="#E6EDF7" text-anchor="middle">PDF</text>
    <rect x="464" y="102" width="52" height="8" rx="4" fill="#E6EDF7"/>
    <rect x="464" y="116" width="36" height="6" rx="3" fill="#8EA0BC"/>
    <rect x="420" y="148" width="96" height="6" rx="3" fill="#8B5CF6" opacity="0.45"/>
  </g>

  <!-- Floating Graduation Cap / Badge Bottom Left -->
  <g transform="translate(48 300)" filter="url(#glow)">
    <rect x="0" y="0" width="110" height="64" rx="16" fill="url(#cardGrad)" stroke="#367CFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M55 14L25 28l30 14 30-14z" fill="url(#accGrad)"/>
    <path d="M37 34v12c8 6 28 6 36 0V34l-18 8z" fill="#8B5CF6"/>
    <path d="M82 29v16" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Rocket / Launch Badge Bottom Right -->
  <g transform="translate(414 296)" filter="url(#glow)">
    <circle cx="48" cy="48" r="38" fill="url(#cardGrad)" stroke="#00D9FF" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M48 24c10 8 14 22 10 34H38c-4-12 0-26 10-34z" fill="url(#priGrad)"/>
    <circle cx="48" cy="42" r="5" fill="#00D9FF"/>
    <path d="M38 50l-8 8h8zM58 50l8 8h-8z" fill="#00D9FF"/>
    <path d="M43 58l5 10 5-10z" fill="#F59E0B"/>
  </g>

  <!-- Glowing Stars & Particles -->
  <g fill="#00D9FF">
    <path d="M506 218l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <path d="M56 232l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <circle cx="228" cy="84" r="5"/>
  </g>
  <circle cx="348" cy="70" r="6" fill="#8B5CF6"/>
  <circle cx="290" cy="404" r="6" fill="#367CFF"/>
</svg>
